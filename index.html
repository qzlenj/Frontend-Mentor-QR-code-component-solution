<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- Fonts Preload -->
    <link
      rel="preload"
      href="./fonts/outfit-v15-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link
      rel="preload"
      href="./fonts/outfit-v15-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="card">
      <img
        class="card__qr"
        src="./images/image-qr-code.png"
        width="576"
        height="576"
        alt="QR code to Frontend Mentor's Homepage."
      />

      <h1 class="card__title">
        Improve your front-end skills by building projects
      </h1>

      <p class="card__description">
        Scan the QR code to visit Frontend Mentor and take your coding skills to
        the next level
      </p>
    </main>

    <footer class="attribution">
      <p class="attribution__challenge">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge"
          >Frontend Mentor</a
        >
      </p>
      <p class="attribution__author">
        Coded by
        <a href="https://github.com/qzlenj" target="_blank"> Ghazaleh </a>
      </p>
    </footer>
  </body>
</html>
